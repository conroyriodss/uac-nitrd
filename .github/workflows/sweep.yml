name: build-sweep
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      freeze:
        description: "Run in freeze mode (S1-S4 all required)"
        type: boolean
        default: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sweep
        env:
          SWEEP_RECORD: ${{ runner.temp }}/sweep_record.json
        run: |
          if [ "${{ inputs.freeze }}" = "true" ]; then bash scripts/sweep.sh --freeze; else bash scripts/sweep.sh; fi
      - name: Sweep tests
        run: |
          python -m pip install pytest==8.4.2 beautifulsoup4==4.13.5
          python -m pytest -q tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-record
          path: ${{ runner.temp }}/sweep_record.json
